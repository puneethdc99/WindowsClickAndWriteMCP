name: Build & Publish WindowsClickAndWriteMCP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore
      working-directory: WindowsClickAndWriteMCP

    - name: Build
      run: dotnet build -c Release --no-restore
      working-directory: WindowsClickAndWriteMCP

    - name: Publish standalone exe (win-x64)
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true -o ./publish
      working-directory: WindowsClickAndWriteMCP

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsClickAndWriteMCP-win-x64
        path: WindowsClickAndWriteMCP/publish/WindowsClickAndWriteMCP.exe
        retention-days: 90

  release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish standalone exe (win-x64)
      run: dotnet publish -c Release -r win-x64 --self-contained false /p:PublishSingleFile=true -o ./publish
      working-directory: WindowsClickAndWriteMCP

    - name: Publish self-contained exe (win-x64)
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o ./publish-self-contained
      working-directory: WindowsClickAndWriteMCP

    - name: Create Release Tag
      id: tag
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $run = "${{ github.run_number }}"
        $tag = "v${date}.${run}"
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT
        echo "Created tag: $tag"

    - name: Rename self-contained exe
      shell: pwsh
      run: |
        Rename-Item -Path "WindowsClickAndWriteMCP/publish-self-contained/WindowsClickAndWriteMCP.exe" -NewName "WindowsClickAndWriteMCP-self-contained.exe"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG }}
        name: WindowsClickAndWriteMCP ${{ steps.tag.outputs.TAG }}
        body: |
          ## WindowsClickAndWriteMCP — Windows Click & Write MCP Server
          
          Automated build from commit ${{ github.sha }}.
          
          ### Downloads
          - **WindowsClickAndWriteMCP.exe** — Framework-dependent (requires .NET 10 runtime, ~4 MB)
          - **WindowsClickAndWriteMCP-self-contained.exe** — Self-contained (no runtime needed, ~70 MB)
        files: |
          WindowsClickAndWriteMCP/publish/WindowsClickAndWriteMCP.exe
          WindowsClickAndWriteMCP/publish-self-contained/WindowsClickAndWriteMCP-self-contained.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
